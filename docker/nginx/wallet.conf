# This file is loaded inside the image's http block.
map $http_upgrade $wallet_connection {
    default upgrade;
    '' close;
}

upstream wallet_hosts {
    zone wallet_hosts 64k;
    # Docker DNS: re-resolve addresses when a Wallet container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server wallet-a:8080 resolve max_fails=1 fail_timeout=5s;
    server wallet-b:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    # Query strings can contain SignalR access tokens.
    access_log off;
    location / {
        proxy_pass http://wallet_hosts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wallet_connection;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        # Do not retry a POST after it has been sent to an upstream.
        # Callers retry ambiguous financial outcomes using the same transaction ID.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        add_header X-Wallet-Upstream $upstream_addr always;
    }
}
